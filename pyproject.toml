[project]
name = "medical-conditions-worker"
version = "0.1.0"
description = "Station 2 of the medical chatbot pipeline: clean, chunk and embed the scraped pages (fastembed, ONNX on CPU)"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # Database
    "pgvector==0.4.1",
    "psycopg2-binary==2.9.10",
    "sqlalchemy==2.0.43",

    # Embeddings with ONNX Runtime, no PyTorch
    "fastembed==0.8.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["services", "repositories", "db"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
