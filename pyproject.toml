[project]
name = "medical-conditions-worker"
version = "0.1.0"
description = "Worker de embeddings optimizado para CPU (ONNXRuntime via light-embed)"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # Base de datos
    "alembic==1.16.5",
    "pgvector==0.4.1",
    "psycopg2-binary==2.9.10",
    "sqlalchemy==2.0.43",
    
    # Embeddings ligeros con ONNX
    "light-embed>=1.0.8",  # Versión aproximada; actualiza con la última de PyPI

    "fastembed==0.7.3",
    
    # Utilidades numéricas (opcional, light-embed usa numpy internamente)
    
    # Opcional: para progreso en batch
    "tqdm>=4.66.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["services", "repositories", "db"]